
<div class="container">
  <!-- add employee Form ! -->
<form (ngSubmit)="addEmployee()">
  <div class="row">
  <div class="col"><input [(ngModel)]="newEmployee.name" name="name" placeholder="Name" required class="form-control"/></div>
   <div class="col"><input [(ngModel)]="newEmployee.gender" name="gender" placeholder="Gender" required class="form-control"/></div>
   <div class="col"><input [(ngModel)]="newEmployee.email" name="email" placeholder="Email" required class="form-control"/></div>
   <div class="col"><input [(ngModel)]="newEmployee.department" name="department" placeholder="Department" required class="form-control"/></div>
   <div class="col"><input [(ngModel)]="newEmployee.deptType" name="deptType" placeholder="Department Type" required class="form-control"/></div>
   <div class="col"><button type="submit" class="btn btn-primary">Add Employee</button></div>
  </div>
</form>
</div>



<hr />
<hr />

<div class="table-responsive container">
  <!-- Tables added employee successfully! -->
  <table class="table table-bordered table-hover">
    <thead>
      <tr>
        <th class="table-dark">ID</th>
        <th class="table-dark">Name</th>
        <th class="table-dark">Gender</th>
        <th class="table-dark">Email</th>
        <th class="table-dark">Department</th>
        <th class="table-dark">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let emp of employees">
        <td *ngIf="editingId !== emp.id">{{ emp.id }}</td>
        
        <td *ngIf="editingId !== emp.id">{{ emp.name }}</td>
        <td *ngIf="editingId === emp.id">
          <input [(ngModel)]="editedEmployee.name" placeholder="Name">
        </td>
        
        <td *ngIf="editingId !== emp.id">{{ emp.gender }}</td>
        <td *ngIf="editingId === emp.id">
          <input [(ngModel)]="editedEmployee.gender" placeholder="Gender">
        </td>

        <td *ngIf="editingId !== emp.id">{{ emp.email }}</td>
        <td *ngIf="editingId === emp.id">
          <input [(ngModel)]="editedEmployee.email" placeholder="Email">
        </td>

        <td *ngIf="editingId !== emp.id">{{ emp.department }}</td>
        <td *ngIf="editingId === emp.id">
          <input [(ngModel)]="editedEmployee.department" placeholder="Department">
        </td>
        <td *ngIf="editingId === emp.id">
          <input [(ngModel)]="editedEmployee.deptType" placeholder="Department Type">
        </td>
        <td>
          <button class="btn btn-info" *ngIf="editingId !== emp.id" (click)="startEdit(emp)">Edit</button>&nbsp;
          <button class="btn btn-success" *ngIf="editingId === emp.id" (click)="saveEdit()">Save</button>
          <button class="btn btn-secondary" *ngIf="editingId === emp.id" (click)="cancelEdit()">Cancel</button>
          <button class="btn btn-warning" (click)="deleteEmployee(emp.id!)" [disabled]="editingId === emp.id">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
